<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique - SUWI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .win-badge {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .loss-badge {
            background-color: #dc3545;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .r-value {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .r-positive {
            color: #28a745;
        }
        
        .r-negative {
            color: #dc3545;
        }
        
        .positive-pnl {
            color: #28a745;
            font-weight: 600;
        }
        
        .negative-pnl {
            color: #dc3545;
            font-weight: 600;
        }
        
        .trade-row:hover {
            background-color: #f8f9fa;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Carte des statistiques -->
        <div class="stats-card">
            <div class="row">
                <div class="col-md-3 stat-item">
                    <div class="stat-value" id="totalTrades">-</div>
                    <div class="stat-label">Trades Total</div>
                </div>
                <div class="col-md-3 stat-item">
                    <div class="stat-value" id="winRate">-</div>
                    <div class="stat-label">Taux de Réussite</div>
                </div>
                <div class="col-md-3 stat-item">
                    <div class="stat-value" id="avgR">-</div>
                    <div class="stat-label">R Moyen</div>
                </div>
                <div class="col-md-3 stat-item">
                    <div class="stat-value" id="totalPnL">-</div>
                    <div class="stat-label">P&L Total</div>
                </div>
            </div>
        </div>
        
        <!-- Carte principale -->
        <div class="main-card">
            <div class="card-header bg-primary text-white p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0">
                            <i class="bi bi-clock-history"></i> Historique des Trades
                        </h3>
                        <small class="opacity-75">Analyse de performance</small>
                    </div>
                    <div>
                        <button class="btn btn-light btn-sm" onclick="loadHistory()">
                            <i class="bi bi-arrow-clockwise"></i> Actualiser
                        </button>
                        <a href="/profile/" class="btn btn-light btn-sm ms-2">
                            <i class="bi bi-person-circle"></i> Profil
                        </a>
                        <a href="/" class="btn btn-light btn-sm ms-2">
                            <i class="bi bi-house"></i> Accueil
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="card-body p-4">
                <!-- Zone de statut -->
                <div id="statusMessage" class="alert d-none"></div>
                
                <!-- Tableau de l'historique -->
                <div id="historyContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Chargement...</span>
                        </div>
                        <p class="mt-3 text-muted">Chargement de l'historique...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% include 'ib_status_badge.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `alert alert-${type}`;
            statusDiv.textContent = message;
            statusDiv.classList.remove('d-none');
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.classList.add('d-none');
                }, 3000);
            }
        }

        function formatPrice(price) {
            if (price === null || price === undefined) return '-';
            return '$' + parseFloat(price).toFixed(2);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
        }

        function formatR(rValue) {
            if (rValue === null || rValue === undefined) return '-';
            
            const num = parseFloat(rValue);
            const formatted = num.toFixed(2) + 'R';
            
            if (num > 0) {
                return `<span class="r-value r-positive">+${formatted}</span>`;
            } else if (num < 0) {
                return `<span class="r-value r-negative">${formatted}</span>`;
            } else {
                return `<span class="r-value">${formatted}</span>`;
            }
        }

        function formatPnL(value) {
            if (value === null || value === undefined) return '-';
            
            const num = parseFloat(value);
            const formatted = formatPrice(num);
            
            if (num > 0) {
                return `<span class="positive-pnl">+${formatted}</span>`;
            } else if (num < 0) {
                return `<span class="negative-pnl">${formatted}</span>`;
            } else {
                return formatted;
            }
        }

        function getExitBadge(exitType) {
            if (!exitType) return '-';
            
            const badges = {
                'TP': '<span class="win-badge">TP</span>',
                'SL': '<span class="loss-badge">SL</span>',
                'MANUAL': '<span class="badge bg-secondary">Manuel</span>'
            };
            
            return badges[exitType] || exitType;
        }

        function updateStats(trades) {
            const totalTrades = trades.length;
            
            if (totalTrades === 0) {
                document.getElementById('totalTrades').textContent = '0';
                document.getElementById('winRate').textContent = '-';
                document.getElementById('avgR').textContent = '-';
                document.getElementById('totalPnL').textContent = '-';
                return;
            }
            
            // Calcul du taux de réussite
            const wins = trades.filter(t => t.pnl_dollar > 0).length;
            const winRate = (wins / totalTrades * 100).toFixed(1);
            
            // Calcul du R moyen
            const rValues = trades.filter(t => t.risk_reward !== null).map(t => parseFloat(t.risk_reward));
            const avgR = rValues.length > 0 ? (rValues.reduce((a, b) => a + b, 0) / rValues.length).toFixed(2) : '-';
            
            // Calcul du P&L total
            const totalPnL = trades.reduce((sum, t) => sum + parseFloat(t.pnl_dollar || 0), 0);
            
            // Mise à jour de l'affichage
            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('avgR').textContent = avgR !== '-' ? avgR + 'R' : '-';
            
            const pnlElement = document.getElementById('totalPnL');
            pnlElement.textContent = formatPrice(totalPnL);
            if (totalPnL > 0) {
                pnlElement.style.color = '#4ade80';
            } else if (totalPnL < 0) {
                pnlElement.style.color = '#f87171';
            }
        }

        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            
            try {
                const response = await fetch('/get-trade-history/');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Erreur lors du chargement');
                }
                
                const trades = data.trades || [];
                
                // Mise à jour des statistiques
                updateStats(trades);
                
                if (trades.length === 0) {
                    // État vide
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h5>Aucun trade dans l'historique</h5>
                            <p class="text-muted">Vos trades fermés apparaîtront ici.</p>
                        </div>
                    `;
                } else {
                    // Générer le tableau
                    let html = `
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Ticker</th>
                                        <th class="text-end">Qty</th>
                                        <th class="text-end">Entrée</th>
                                        <th class="text-end">Sortie</th>
                                        <th class="text-end">SL</th>
                                        <th class="text-end">TP</th>
                                        <th class="text-end">P&L</th>
                                        <th class="text-end">R</th>
                                        <th class="text-center">Type</th>
                                        <th>Date Entrée</th>
                                        <th>Date Sortie</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    trades.forEach(trade => {
                        html += `
                            <tr class="trade-row">
                                <td><strong>${trade.ticker}</strong></td>
                                <td class="text-end">${trade.quantity}</td>
                                <td class="text-end">${formatPrice(trade.entry_price)}</td>
                                <td class="text-end">${formatPrice(trade.exit_price)}</td>
                                <td class="text-end">${trade.sl_price ? formatPrice(trade.sl_price) : '-'}</td>
                                <td class="text-end">${trade.tp_price ? formatPrice(trade.tp_price) : '-'}</td>
                                <td class="text-end">${formatPnL(trade.pnl_dollar)}</td>
                                <td class="text-end">${formatR(trade.risk_reward)}</td>
                                <td class="text-center">${getExitBadge(trade.exit_type)}</td>
                                <td><small>${formatDate(trade.entry_date)}</small></td>
                                <td><small>${formatDate(trade.exit_date)}</small></td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    
                    container.innerHTML = html;
                    showStatus(`${trades.length} trade(s) chargé(s)`, 'success');
                }
                
            } catch (error) {
                console.error('Erreur chargement historique:', error);
                showStatus('Erreur: ' + error.message, 'danger');
                
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-triangle"></i>
                        <h5>Erreur de chargement</h5>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-primary" onclick="loadHistory()">
                            <i class="bi bi-arrow-clockwise"></i> Réessayer
                        </button>
                    </div>
                `;
            }
        }

        // Charger l'historique au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });
    </script>
</body>
</html>
